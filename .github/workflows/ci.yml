name: CI

on:
  # Branches with an open PR would otherwise run everything twice, once per
  # trigger, on the same commit. pull_request covers proposed changes (and
  # fork PRs, which push does not see); push covers what actually lands.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # No paths filter, on any job: a required status check that a path filter
  # skips never reports at all — GitHub shows it as permanently "pending" and
  # blocks the merge forever. Every job here is cheap enough to run always,
  # which also keeps the checks honest.
  schedule:
    # Mondays at 13:00 UTC — catches drift (a new KiCad image, a moved IDF
    # dependency) even when no PR has touched the tree recently. Always runs
    # against main.
    - cron: "0 13 * * 1"
  workflow_dispatch:

# Supersede in-flight runs for the same branch rather than finishing them:
# pushing twice in quick succession otherwise runs the container build to
# completion on a commit nobody is waiting for. Never cancels main, where
# every commit's result is worth having on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides what the expensive jobs need to do. Gating happens here, at the
  # job level, and never with a paths filter on the triggers: a required check
  # that never runs reports as permanently pending and blocks the merge, while
  # a job skipped by `if:` reports a skipped conclusion that branch protection
  # accepts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      esphome: ${{ steps.filter.outputs.esphome }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit rather than a tag: a tag is a movable pointer, and
      # this action can see the diff of every PR that lands here.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            esphome:
              - 'firmware/esphome-spa/**'
              - '.github/workflows/ci.yml'

  hardware:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Seed KiCad's default global library tables
        # A headless kicad-cli run creates its settings dir (kicad.json etc)
        # but never seeds sym-lib-table/fp-lib-table the way the GUI's
        # first-run wizard does, so every referenced library (even stock
        # ones like power/Interface_UART) shows up as "not included" in
        # ERC/DRC. Copy KiCad's own bundled defaults into place instead.
        run: |
          profile=$(kicad-cli version | cut -d. -f1,2)
          config_dir="$HOME/.config/kicad/$profile"
          mkdir -p "$config_dir"
          cp -n /usr/share/kicad/template/sym-lib-table "$config_dir/sym-lib-table"
          cp -n /usr/share/kicad/template/fp-lib-table "$config_dir/fp-lib-table"

      - name: Run ERC on each hardware project's schematic
        run: |
          status=0
          for pro in $(find hardware -name '*.kicad_pro'); do
            dir=$(dirname "$pro")
            name=$(basename "$pro" .kicad_pro)
            sch="$dir/$name.kicad_sch"
            if [ -f "$sch" ]; then
              echo "== ERC: $sch =="
              report="$dir/$name-erc.json"
              kicad-cli sch erc \
                --output "$report" \
                --format json \
                --severity-error \
                --severity-warning \
                "$sch" || status=1
              cat "$report"
              python3 .github/scripts/kicad-report-has-errors.py "$report" || status=1
            fi
          done
          exit $status

      - name: Run DRC on each hardware project's board (if any)
        run: |
          status=0
          for pro in $(find hardware -name '*.kicad_pro'); do
            dir=$(dirname "$pro")
            name=$(basename "$pro" .kicad_pro)
            pcb="$dir/$name.kicad_pcb"
            if [ -f "$pcb" ]; then
              echo "== DRC: $pcb =="
              report="$dir/$name-drc.json"
              kicad-cli pcb drc \
                --output "$report" \
                --format json \
                --severity-error \
                --severity-warning \
                "$pcb" || status=1
              cat "$report"
              python3 .github/scripts/kicad-report-has-errors.py "$report" || status=1
            fi
          done
          exit $status

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: |
            hardware/**/*-erc.json
            hardware/**/*-drc.json
          if-no-files-found: warn

  # Worth gating: ESPHome pulls its own ESP-IDF on first run (cached below,
  # but still the priciest job here). hardware stays unconditional, since
  # routing it through `changes` would cost more than it saves and keeps the
  # required check as simple as possible. This is what caught the missing
  # text_sensor.h include upstream needed against current ESPHome — a
  # config-only edit here can still break the vendored component's compile.
  esphome-build:
    needs: changes
    if: needs.changes.outputs.esphome == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ESPHome's ESP-IDF download
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}

      - name: Install ESPHome
        run: pip install esphome

      - name: Supply placeholder secrets
        # secrets.yaml is gitignored; the example has no real credentials and
        # never reaches a board from here, so it's exactly what a compile
        # check wants.
        run: |
          cp firmware/esphome-spa/secrets.yaml.example \
             firmware/esphome-spa/secrets.yaml

      - name: Compile
        run: esphome compile firmware/esphome-spa/esp32-spa.yaml

  # Runs only on version tags, independent of the `changes` gate above: a tag
  # push means "release this," full stop, regardless of what the diff since
  # the last commit touched.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The trigger pattern is v*, and Compile below strips only the leading
      # "v", so a typo like "vtest" would publish a release whose firmware
      # introduces itself to Home Assistant as version "test". Check the shape
      # first: this runs before checkout so a bad tag costs nothing.
      - name: Reject a tag that is not a version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR[.PATCH]; nothing was published."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ESPHome's ESP-IDF download
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}

      - name: Install ESPHome
        run: pip install esphome

      - name: Supply placeholder secrets
        # secrets.yaml is gitignored; the example has no real credentials and
        # never reaches a board from here, so it's exactly what a release
        # build wants.
        run: |
          cp firmware/esphome-spa/secrets.yaml.example \
             firmware/esphome-spa/secrets.yaml

      - name: Compile
        # The tag is the single source of truth for the version. -s overrides
        # the `version` substitution in the YAML so the binary reports the same
        # number the release artifacts below are named for; without it a v0.2
        # release could ship a firmware that tells Home Assistant it is 0.1.
        # The leading "v" is stripped so the tag v0.1 reports as 0.1.
        run: |
          esphome -s version "${GITHUB_REF_NAME#v}" \
            compile firmware/esphome-spa/esp32-spa.yaml

      - name: Collect firmware binaries
        # factory.bin is a full-flash image (bootloader + partition table +
        # app) for flashing a blank board; ota.bin is the app image alone,
        # for ESPHome's OTA updater or a board already running this firmware.
        run: |
          build_dir=firmware/esphome-spa/.esphome/build/esp32-spa/build
          mkdir -p release
          cp "$build_dir/firmware.factory.bin" "release/esp32-spa-${GITHUB_REF_NAME}.factory.bin"
          cp "$build_dir/firmware.ota.bin" "release/esp32-spa-${GITHUB_REF_NAME}.ota.bin"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
